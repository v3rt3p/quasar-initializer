<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-LK code generator</title>
  <style>
    body { font: 16px/1.4 sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: inline-block; min-width: 7rem; }
    input { min-width: 18rem; padding: .35rem; }
    button { margin-right: .5rem; padding: .45rem .8rem; }
    #qr { display: block; width: min(90vw, 420px); margin: 1rem 0; image-rendering: pixelated; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>QR-LK code generator</h1>
  <p>Builds the binary QR-LK payload locally, then renders it with a standard QR implementation.</p>
  <form id="form">
    <p><label for="ssid">SSID</label><input id="ssid" required></p>
    <p><label for="password">Password</label><input id="password" required></p>
    <p><label for="token">xTokenCode</label><input id="token" required></p>
    <p><button type="submit">Generate QR</button><button type="reset">Clear</button></p>
  </form>
  <p id="status" role="status"></p>
  <canvas id="qr" aria-label="Generated QR code"></canvas>
  <p><a id="download" hidden download="quasar-qr-lk.png">Download PNG</a></p>
  <pre id="details"></pre>
  <script src="qrcode-generator.js"></script>
  <script src="quasar-qr.js"></script>
  <script>
    const form = document.getElementById('form');
    const canvas = document.getElementById('qr');
    const status = document.getElementById('status');
    const details = document.getElementById('details');
    const download = document.getElementById('download');
    let url;

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      try {
        const payload = QuasarQr.makePayload({
          ssid: document.getElementById('ssid').value,
          password: document.getElementById('password').value,
          xTokenCode: document.getElementById('token').value,
        });
        const qr = qrcode(0, 'M');
        qr.addData(QuasarQr.toBinaryString(payload), 'Byte');
        qr.make();
        canvas.width = canvas.height = 420;
        const context = canvas.getContext('2d');
        const moduleCount = qr.getModuleCount();
        const cell = 420 / (moduleCount + 8);
        context.fillStyle = '#fff';
        context.fillRect(0, 0, 420, 420);
        context.fillStyle = '#000';
        for (let row = 0; row < moduleCount; row++) {
          for (let column = 0; column < moduleCount; column++) {
            if (qr.isDark(row, column)) context.fillRect((column + 4) * cell, (row + 4) * cell, cell, cell);
          }
        }
        if (url) URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          if (!blob) return;
          url = URL.createObjectURL(blob);
          download.href = url;
          download.hidden = false;
        }, 'image/png');
        status.textContent = 'Generated locally. Scan the QR code from the display.';
        details.textContent = JSON.stringify({
          payloadBytes: Array.from(payload),
          payloadHex: Array.from(payload, (byte) => byte.toString(16).padStart(2, '0')).join(' '),
          crc16: QuasarQr.crc16(payload.slice(0, -2)).toString(16).padStart(4, '0'),
          qrModules: moduleCount,
        }, null, 2);
      } catch (error) {
        status.textContent = error.message;
        details.textContent = '';
        canvas.width = canvas.height = 0;
        download.hidden = true;
      }
    });

    form.addEventListener('reset', () => {
      status.textContent = '';
      details.textContent = '';
      canvas.width = canvas.height = 0;
      download.hidden = true;
      if (url) URL.revokeObjectURL(url);
      url = null;
    });
  </script>
</body>
</html>
